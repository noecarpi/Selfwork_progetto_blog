<!doctype html>
<html lang="en">
<html xmlns:th="http:www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <title th:text="${title}">Title</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container my-3">
        <div class="row">
            <div class="col">
                <h1 class="text-center">Tutti i post</h1>
                <a th:href="@{/posts/create}" class="btn btn-info">crea nuovo post</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div th:each="post : ${posts}" class="col-4">
                <div class="card" style="width: 18rem;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${post.title}"></h5>
                        <h6 class="card-subtitle mb-2 text-body-secondary" th:text="${post.author.fullname}"></h6>
                        <p class="card-text" th:text="${post.body}"></p>
                        <p class="card-text"><small class="text-body-secondary"  th:text="${post.publishDate}"></small></p>
                        <p class="card-text"><small class="text-body-secondary"  th:text="${post.numberOfComments} +' commenti'"></small></p>
                        <!-- <a href="#" class="card-link">view</a> -->
                        <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-warning mb-2">Modifica</a>
                        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="POST">
                            <button type="submit" class="btn btn-danger">Elimina</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
