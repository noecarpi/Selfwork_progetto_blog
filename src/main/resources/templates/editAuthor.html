<!doctype html>
<html lang="en">
<html xmlns:th="http:www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <title th:text="${title}">Title</title>
</head>
<body>
    
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1>Modifica autore</h1>
            </div>
            <div class="col-10 my-5">
                <form th:action="@{/authors/{id}/edit(id=${author.id})}" method="POST" th:object="${author}">
                    <div class="row mb-3">
                        <div class="col">
                            <label for="firstname" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="firstname" th:field="*{name}">
                        </div>
                        <div class="col">
                            <label for="lastname" class="form-label">Cognome</label>
                            <input type="text" class="form-control" id="lastname" th:field="*{surname}" >
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" >
                    </div>
                    <button type="submit" class="btn btn-success">Salva</button>
                    <button type="reset"class="btn btn-danger">Reset modifiche</button>
                </form>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
