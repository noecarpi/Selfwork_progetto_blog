<!doctype html>
<html lang="en">
<html xmlns:th="http:www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <title th:text="${title}">Title</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1>Modifica post</h1>
            </div>
            <div class="col-10 my-5">
                <form th:action="@{/posts/{id}/edit(id=${post.id})}" method="POST" th:object="${post}">
                    <div class="row mb-3">
                        <div class="col">
                            <label for="title" class="form-label">Titolo</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}">
                        </div>
                        <!-- per ora cosi con gli autori perche' non c'e' il login -->
                        <div class="col">
                            <label for="author" class="form-label">Autore</label>
                            <select name="author" class="form-control" id="author" th:field="*{author.id}">
                                <option value="">Seleziona autore</option>
                                <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.fullname}"></option>
                            </select>
                        </div>
                        <div class=" mb-3">
                            <label for="body" class="form-label">Testo</label>
                            <textarea name="body" class="form-control" id="body" th:field="*{body}" placeholder="a cosa stai pensando..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Salva</button>
                    <button type="reset"class="btn btn-danger">Reset modifiche</button>    
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
