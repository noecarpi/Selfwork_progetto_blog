<!doctype html>
<html lang="en">
<html xmlns:th="http:www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <title th:text="${title}">Title</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-3">
        <div class="row">
            <div class="col">
                <h1 class="text-center">Tutti i commenti</h1>
                <a th:href="@{/comments/create}" class="btn btn-info">scrivi un commento</a>
            </div>
        </div>
    </div>

    <div class="container">
        <table class="table table-striped-columns">
            <thead>
                <tr>
                <th scope="col">Fullname</th>
                <th scope="col">Body</th>
                <th scope="col">Post</th>
                <th scope="col"></th>
                <th scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="comment:${comments}">
                    <td th:text="${comment.author.fullname}"></td>
                    <td th:text="${comment.body}"></td>
                    <td th:text="${comment.post.title}"></td>
                    <td>
                        <a th:href="@{/comments/{id}/edit(id=${comment.id})}" class="btn btn-warning">Modifica</a>
                    </td>
                    <td>
                        <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="POST">
                            <button type="submit" class="btn btn-danger">Elimina</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
